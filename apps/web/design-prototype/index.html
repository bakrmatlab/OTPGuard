<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OTPGuard — Design prototype</title>
    <link rel="stylesheet" href="style.css" />
    <script src="prototype.js" defer></script>
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <div class="review-note">
      Design prototype
      <span
        >All data and actions are synthetic. Nothing connects or saves.</span
      >
    </div>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="OTPGuard home"
        ><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span
        >OTPGuard</a
      >
      <nav aria-label="Main navigation">
        <a href="#setup">Setup</a><a href="#help">Help</a
        ><a class="nav-action" href="#manage"
          >Open workspace <span aria-hidden="true">↗</span></a
        >
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <a class="brand" href="#home">OTPGuard</a
      ><span>Email codes. Processed in your browser.</span
      ><a href="#help">Privacy & help</a>
    </footer>
    <nav class="review-bar" aria-label="Prototype screens">
      <span>Review</span><a href="#home">Homepage</a
      ><a href="#manage">Management</a><a href="#popups">Popup states</a>
    </nav>

    <template id="home">
      <section class="hero">
        <div class="hero-copy">
          <p class="context">
            <span class="small-mark" aria-hidden="true"></span> Gmail codes, in
            Chrome
          </p>
          <h1>
            Find the code.<br />Choose <span class="fill-word">Fill.</span>
          </h1>
          <p class="hero-lead">
            OTPGuard finds a recent email code while you sign in. You decide
            when it goes into the page.
          </p>
          <div class="hero-actions">
            <a class="button primary" href="#setup"
              >Install for Chrome <span aria-hidden="true">↗</span></a
            ><a class="text-link" href="#demo"
              >Try the demo <span aria-hidden="true">↓</span></a
            >
          </div>
          <p class="fine">No code is filled without your click.</p>
        </div>
        <div class="handoff-art" aria-hidden="true">
          <div class="orbit orbit-one"></div>
          <div class="orbit orbit-two"></div>
          <div class="signal-spine"></div>
          <div class="signal-source">
            <svg viewBox="0 0 32 32">
              <path d="M5 8h22v16H5zM5 8l11 9L27 8" />
            </svg>
          </div>
          <div class="signal-card">
            <div class="signal-top">
              <span class="status-dot"></span>Code found
            </div>
            <div class="signal-code">••••••</div>
            <div class="signal-fill">Fill <span>↗</span></div>
            <div class="signal-tail">OTPGuard</div>
          </div>
          <div class="art-caption">
            Inbox <span>→</span> Your click <span>→</span> Code field
          </div>
        </div>
      </section>
      <section id="demo" class="demo-section">
        <div class="section-intro">
          <h2>One click.<br />One code field.</h2>
          <p>
            Try the handoff with a made-up code.<br />No mailbox. No sign-in. No
            submission.
          </p>
          <span class="demo-label">Synthetic demo</span>
        </div>
        <div class="demo-stage">
          <div class="sample-page">
            <div class="sample-chrome">
              <span class="window-dots" aria-hidden="true">● ● ●</span
              ><span>example.test</span><span aria-hidden="true">⌁</span>
            </div>
            <div class="sample-form">
              <div class="sample-logo" aria-hidden="true">e</div>
              <h3>Check your email</h3>
              <p>Enter your verification code.</p>
              <label for="demo-code">Verification code</label
              ><input
                id="demo-code"
                autocomplete="off"
                inputmode="numeric"
                placeholder="— — — — — —"
                maxlength="6"
                readonly
              />
              <p class="demo-result" role="status" aria-live="polite">
                Waiting for your click.
              </p>
              <button class="text-link reset-demo" type="button">
                Reset demo
              </button>
            </div>
          </div>
          <div class="demo-popup popup">
            <div class="popup-brand">
              <span class="brand-mark" aria-hidden="true"
                ><i></i><i></i><i></i></span
              >OTPGuard
            </div>
            <div class="popup-status">
              <span class="status-dot"></span> Code found
            </div>
            <button class="button primary demo-fill" type="button">
              Fill <span aria-hidden="true">↗</span></button
            ><a class="popup-site" href="#manage"
              >Open OTPGuard <span aria-hidden="true">↗</span></a
            >
          </div>
        </div>
      </section>
      <section class="privacy-strip">
        <div class="privacy-symbol" aria-hidden="true">
          <svg viewBox="0 0 48 48">
            <path
              d="M24 5l15 6v13c0 9-15 18-15 18S9 33 9 24V11zM17 23l5 5 10-11"
            />
          </svg>
        </div>
        <div>
          <h2>Your mail stays in your browser.</h2>
          <p>
            Gmail tokens, messages and codes stay inside the extension. OTPGuard
            servers do not receive them.
          </p>
        </div>
        <a class="text-link" href="#help"
          >Read the details <span aria-hidden="true">↗</span></a
        >
      </section>
    </template>

    <template id="manage">
      <div class="workspace">
        <aside class="workspace-nav">
          <p class="workspace-name">Your workspace</p>
          <nav aria-label="Workspace navigation">
            <a href="#manage" aria-current="page"
              ><span aria-hidden="true">⌘</span> Browser settings</a
            ><a href="#activity"><span aria-hidden="true">◷</span> Activity</a
            ><a href="#setup"><span aria-hidden="true">＋</span> Setup</a
            ><a href="#help"
              ><span aria-hidden="true">?</span> Help & privacy</a
            >
          </nav>
          <div class="profile">
            <span class="avatar" aria-hidden="true">J</span>
            <div>Jordan<span>Example account</span></div>
          </div>
        </aside>
        <div class="workspace-content">
          <div class="page-heading">
            <div>
              <p class="context">This Chrome profile</p>
              <h1>Browser settings</h1>
              <p>Control how OTPGuard finds codes.</p>
            </div>
            <span class="demo-label">Example workspace</span>
          </div>
          <div class="connection-notice">
            <span class="notice-icon" aria-hidden="true">i</span>
            <p>
              <strong>Preview of browser management.</strong> This website
              cannot read or change extension settings yet. Everything below is
              an example, reset when you reload.
            </p>
          </div>
          <section class="settings-section">
            <div class="settings-heading">
              <h2>Connections</h2>
              <p>Your OTPGuard account and Gmail mailbox can be different.</p>
            </div>
            <div class="setting-row">
              <div class="row-icon" aria-hidden="true">J</div>
              <div class="row-copy">
                <h3>OTPGuard account</h3>
                <p>jordan@example.test</p>
              </div>
              <span class="state-tag">Example signed in</span
              ><button
                class="button secondary"
                type="button"
                data-action="account"
              >
                Sign out
              </button>
            </div>
            <div class="setting-row">
              <div class="row-icon mail-icon" aria-hidden="true">
                <svg viewBox="0 0 32 32">
                  <path d="M5 8h22v16H5zM5 8l11 9L27 8" />
                </svg>
              </div>
              <div class="row-copy">
                <h3>Gmail mailbox</h3>
                <p>jordan.mail@example.test</p>
              </div>
              <span class="state-tag" id="mailbox-state">Example connected</span
              ><button
                class="button secondary"
                type="button"
                data-action="mailbox"
              >
                Disconnect
              </button>
            </div>
          </section>
          <section class="settings-section">
            <div class="settings-heading">
              <h2>Finding codes</h2>
              <p>Finding is automatic. Filling always needs your click.</p>
            </div>
            <div class="setting-row">
              <div class="row-copy">
                <h3>Find codes automatically</h3>
                <p>
                  Look for recent email codes when an eligible field appears.
                </p>
              </div>
              <button
                class="switch"
                type="button"
                role="switch"
                aria-checked="true"
                aria-label="Find codes automatically"
              >
                <span></span>
              </button>
            </div>
            <div class="setting-row">
              <div class="row-copy">
                <h3>Website access</h3>
                <p>
                  Detect code fields on HTTPS websites. Sites you block are
                  excluded.
                </p>
              </div>
              <span class="state-tag">Example allowed</span
              ><a class="text-link" href="#setup"
                >Setup details <span aria-hidden="true">↗</span></a
              >
            </div>
          </section>
          <section class="settings-section">
            <div class="settings-heading">
              <h2>Blocked sites</h2>
              <p>OTPGuard will not search or fill on these sites.</p>
            </div>
            <div id="blocks">
              <div class="setting-row blocked-row">
                <span class="block-symbol" aria-hidden="true">⊘</span>
                <div class="row-copy"><h3>https://example.test</h3></div>
                <button class="button secondary remove-block" type="button">
                  Remove
                </button>
              </div>
            </div>
            <div class="block-form">
              <label for="block-url">Block a website</label>
              <div>
                <input
                  id="block-url"
                  type="url"
                  placeholder="https://example.test"
                  required
                /><button class="button secondary add-block" type="button">
                  Add site
                </button>
              </div>
              <p class="fine" id="block-feedback" role="status">
                Use the full HTTPS origin. No paths or wildcards.
              </p>
            </div>
          </section>
          <section class="settings-section history-setting">
            <div class="settings-heading">
              <h2>Local activity</h2>
              <p>
                Results are kept in this browser for up to 7 days. No codes or
                email content.
              </p>
            </div>
            <a class="text-link" href="#activity"
              >View example activity <span aria-hidden="true">↗</span></a
            >
          </section>
          <p class="workspace-footnote">
            Cloud history is unavailable. This design does not enable
            synchronization.
          </p>
          <p class="action-feedback" role="status" aria-live="polite"></p>
        </div>
      </div>
    </template>

    <template id="popups">
      <section class="popup-review">
        <div class="page-heading">
          <div>
            <p class="context">Extension</p>
            <h1>Just the current action.</h1>
            <p>Four states. One place for everything else.</p>
          </div>
          <span class="demo-label">Synthetic states</span>
        </div>
        <div class="popup-grid">
          <article class="popup-case">
            <h2>Ready</h2>
            <div class="popup">
              <div class="popup-brand">
                <span class="brand-mark" aria-hidden="true"
                  ><i></i><i></i><i></i></span
                >OTPGuard
              </div>
              <div class="popup-status">Ready to find</div>
              <p>Open an email code field.</p>
              <button class="button secondary state-find" type="button">
                Find code <span aria-hidden="true">↗</span></button
              ><a class="popup-site" href="#manage"
                >Open OTPGuard <span aria-hidden="true">↗</span></a
              >
            </div>
          </article>
          <article class="popup-case">
            <h2>Searching</h2>
            <div class="popup">
              <div class="popup-brand">
                <span class="brand-mark" aria-hidden="true"
                  ><i></i><i></i><i></i></span
                >OTPGuard
              </div>
              <div class="popup-status">
                <span class="search-indicator" aria-hidden="true"></span>Finding
                a code…
              </div>
              <p>Checking recent email.</p>
              <div class="search-track" aria-hidden="true"><span></span></div>
              <a class="popup-site" href="#manage"
                >Open OTPGuard <span aria-hidden="true">↗</span></a
              >
            </div>
          </article>
          <article class="popup-case">
            <h2>Code found</h2>
            <div class="popup">
              <div class="popup-brand">
                <span class="brand-mark" aria-hidden="true"
                  ><i></i><i></i><i></i></span
                >OTPGuard
              </div>
              <div class="popup-status">
                <span class="status-dot"></span> Code found
              </div>
              <button class="button primary state-fill" type="button">
                Fill <span aria-hidden="true">↗</span></button
              ><a class="popup-site" href="#manage"
                >Open OTPGuard <span aria-hidden="true">↗</span></a
              >
            </div>
          </article>
          <article class="popup-case">
            <h2>No code</h2>
            <div class="popup">
              <div class="popup-brand">
                <span class="brand-mark" aria-hidden="true"
                  ><i></i><i></i><i></i></span
                >OTPGuard
              </div>
              <div class="popup-status">
                <span class="failure-indicator" aria-hidden="true">!</span>No
                code found
              </div>
              <p>Request a new code, then retry.</p>
              <button class="button secondary state-retry" type="button">
                Retry <span aria-hidden="true">↗</span></button
              ><a class="popup-site" href="#manage"
                >Open OTPGuard <span aria-hidden="true">↗</span></a
              >
            </div>
          </article>
        </div>
        <div class="popup-notes">
          <p>
            No code preview, copy action, account panel or preferences inside
            the popup.
          </p>
          <p>
            Setup failures use a short explanation and
            <strong>Open OTPGuard</strong>. Ambiguity, changed pages and blocked
            sites never expose Fill.
          </p>
        </div>
        <div class="failure-selector">
          <label for="failure-state">Preview a refusal</label
          ><select id="failure-state">
            <option value="none">No code found</option>
            <option value="ambiguous">Multiple possible codes</option>
            <option value="changed">Page changed</option>
            <option value="reconnect">Gmail disconnected</option>
            <option value="blocked">Site blocked</option>
            <option value="unsupported">Unsupported field</option>
            <option value="expired">Code expired</option>
            <option value="replay">Code already used</option>
          </select>
        </div>
      </section>
    </template>

    <template id="setup">
      <section class="guide">
        <div class="page-heading">
          <div>
            <p class="context">Chrome extension</p>
            <h1>Set up OTPGuard</h1>
            <p>Connect once. Choose Fill each time.</p>
          </div>
          <span class="demo-label">Setup preview</span>
        </div>
        <ol class="setup-steps">
          <li>
            <div>
              <h2>Install the extension</h2>
              <p>
                Load the current local review package in Chrome, then pin
                OTPGuard to the toolbar.
              </p>
              <details>
                <summary>Local installation steps</summary>
                <p>
                  Open chrome://extensions, enable Developer mode, choose Load
                  unpacked, and select the provided extension folder. Public
                  store installation is not available yet.
                </p>
              </details>
            </div>
            <span class="step-number" aria-hidden="true">1</span>
          </li>
          <li>
            <div>
              <h2>Sign in to OTPGuard</h2>
              <p>
                Use your OTPGuard account. Your account signs you in; it does
                not give access to Gmail.
              </p>
            </div>
            <span class="step-number" aria-hidden="true">2</span>
          </li>
          <li>
            <div>
              <h2>Connect Gmail</h2>
              <p>
                Choose the mailbox that receives your codes. Google’s read-only
                permission allows reading mail; OTPGuard processes recent
                candidates inside the extension.
              </p>
            </div>
            <span class="step-number" aria-hidden="true">3</span>
          </li>
          <li>
            <div>
              <h2>Allow website detection</h2>
              <p>
                Optional HTTPS website access lets OTPGuard find code fields. A
                recent code can still belong to a different sign-in: Fill does
                not verify the sender or its relationship to the website.
              </p>
              <p>
                Only choose Fill on a page you intended to use. The page can
                read the inserted code and may continue automatically.
              </p>
            </div>
            <span class="step-number" aria-hidden="true">4</span>
          </li>
        </ol>
        <div class="guide-end">
          <p>
            Permission and connection actions must run in the extension. This
            prototype grants no access.
          </p>
          <a class="button primary" href="#popups"
            >Preview the extension <span aria-hidden="true">↗</span></a
          >
        </div>
      </section>
    </template>

    <template id="activity">
      <section class="guide">
        <div class="page-heading">
          <div>
            <p class="context">This browser only</p>
            <h1>Activity</h1>
            <p>Recent results, without codes or mail content.</p>
          </div>
          <span class="demo-label">Synthetic activity</span>
        </div>
        <div class="connection-notice">
          <span class="notice-icon" aria-hidden="true">i</span>
          <p>
            The website cannot read extension history yet. These examples show
            the proposed layout.
          </p>
        </div>
        <div class="activity-list">
          <div>
            <span class="activity-icon success" aria-hidden="true">✓</span>
            <p><strong>Code inserted</strong><span>example.test</span></p>
            <time>Example: just now</time>
          </div>
          <div>
            <span class="activity-icon" aria-hidden="true">⊘</span>
            <p><strong>Fill cancelled</strong><span>Page changed</span></p>
            <time>Example: 8 minutes ago</time>
          </div>
          <div>
            <span class="activity-icon" aria-hidden="true">−</span>
            <p><strong>No code found</strong><span>Search ended</span></p>
            <time>Example: 1 hour ago</time>
          </div>
        </div>
        <p class="fine">
          A code inserted into a field does not mean the website accepted it.
          Local history expires after 7 days.
        </p>
        <a class="text-link" href="#manage">Back to browser settings</a>
      </section>
    </template>

    <template id="help">
      <section class="guide help">
        <div class="page-heading">
          <div>
            <h1>Help & privacy</h1>
            <p>The useful details, in one place.</p>
          </div>
        </div>
        <details open>
          <summary>What happens when I choose Fill?</summary>
          <p>
            The extension checks that your account, mailbox, current page and
            code field still match the pending request. It inserts the code only
            after your click. It never clicks Submit or submits a form; some
            websites continue automatically when the field is filled.
          </p>
        </details>
        <details>
          <summary>Does “Code found” mean the site is verified?</summary>
          <p>
            No. A recent, unambiguous email code is a candidate. Timing and
            format do not prove sender identity or that the email belongs to
            this website’s sign-in. A wrong single candidate is possible.
          </p>
        </details>
        <details>
          <summary>Where does my mail go?</summary>
          <p>
            Gmail tokens, messages and codes stay inside the extension. They are
            not sent to OTPGuard servers or saved in application history. Once
            inserted, a code is readable by the website.
          </p>
        </details>
        <details>
          <summary>Why won’t OTPGuard fill?</summary>
          <p>
            It stops for ambiguous codes, unsupported fields, expired offers,
            changed pages, typed-in values, missing permissions, disconnected
            accounts or blocked sites. Request a new code or complete your usual
            manual sign-in.
          </p>
        </details>
        <details>
          <summary>Can this website change extension settings?</summary>
          <p>
            Not yet. Browser management on this prototype uses examples only. A
            same-browser connection needs a separate reviewed implementation. No
            cloud history or settings synchronization is activated.
          </p>
        </details>
        <details>
          <summary>How do I disconnect Gmail?</summary>
          <p>
            Use the current extension’s Gmail disconnect control. Disconnect
            cancels pending requests, clears local connection state and attempts
            to revoke the provider grant. Signing out of OTPGuard is a separate
            action.
          </p>
        </details>
        <a class="button secondary" href="#setup">Setup guide</a>
      </section>
    </template>
  </body>
</html>
