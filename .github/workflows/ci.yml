name: Foundation checks
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'documentation/**']
  pull_request:
    paths-ignore: ['**/*.md', 'documentation/**']
  schedule:
    # Weekly advisory check, so new vulnerabilities surface even without pushes.
    - cron: '17 6 * * 1'
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  # One job on purpose: GitHub bills each job rounded up to a whole minute.
  checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release. It is reachable only
      # through @next/eslint-plugin-next, on glob patterns from our own lint config.
      # Remove the ignore once a fixed braces ships.
      - run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: apps/web/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('apps/web/**', 'packages/**', '!**/node_modules/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - run: bun run build
      - run: bun run check
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run package:review
      - run: bun run check:packages

  audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # bun audit reads bun.lock directly; no install needed. Keep the ignore list
      # identical to the checks job.
      - run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
