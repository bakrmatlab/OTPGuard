name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run build
      - run: bun run build:mock
      - run: bun run check
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build:native-auth
        env:
          OTPGUARD_NATIVE_CLERK_ORIGIN: https://synthetic.clerk.accounts.dev
          OTPGUARD_NATIVE_CONVEX_ORIGIN: https://synthetic.convex.cloud
      - run: bun run test:native-browser
      - run: bun run package:review
      - run: bun run check:packages
