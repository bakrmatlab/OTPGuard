name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: bun install --frozen-lockfile
      # braces <=3.0.3 (GHSA-vfj7-8cjw-p6xm) has no patched release. It is reachable only
      # through @next/eslint-plugin-next, on glob patterns from our own lint config.
      # Remove the ignore once a fixed braces ships.
      - run: bun audit --ignore=GHSA-vfj7-8cjw-p6xm
      - run: bun run build
      - run: bun run check
      - run: bun x --no-install playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run package:review
      - run: bun run check:packages
